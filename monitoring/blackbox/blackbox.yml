# Blackbox exporter probe modules (Grafana → Service Health)
modules:
  # Service deep health check: GET /health must answer 2xx (DEGRADED still answers 200, DOWN = 503)
  http_health:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp: ['"status"\s*:\s*"(UP|DEGRADED)"']

  # Plain HTTP endpoint answering 2xx (MinIO, Grafana stack readiness)
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4

  # Port accepts TCP connections (PostgreSQL, Kafka)
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4

  # Redis answers PING with PONG
  redis_ping:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      query_response:
        - send: "PING\r\n"
        - expect: "^\\+PONG"
