# Tracing for every Node service: utils/tracing.js loads before the service code and sends
# OpenTelemetry spans to Grafana Alloy (→ Tempo). Unset OTEL_EXPORTER_OTLP_ENDPOINT to disable.
x-otel-env: &otel-env
  NODE_OPTIONS: --import /app/utils/tracing.js
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318

services:
  # ========================================================
  # 1. PostgreSQL Database Server (Isolated DBs)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: auth_db,user_db,product_db,purchase_db,order_db,sale_db,inventory_db,notification_db,policy_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # ========================================================
  # 1b. Redis cache (in-memory only; services fall back to PostgreSQL if it is down)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-net

  # ========================================================
  # 1d. Redis job queues (BullMQ) — separate from the cache Redis on purpose:
  #     noeviction (never drop a queued job) + AOF persistence (survive restarts)
  #     In-network: redis-queue:6379   From the host: localhost:6380
  # ========================================================
  redis-queue:
    image: redis:7-alpine
    container_name: redis-queue
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-net

  # ========================================================
  # 1c. Kafka event bus (single-node KRaft, no ZooKeeper)
  #     Services publish via a transactional outbox and consume idempotently (inbox table).
  #     In-network: kafka:9092   From the host: localhost:29092
  # ========================================================
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - ecommerce-net

  # One-shot job: create the event topics (auto-creation is off so typos fail loudly)
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in order.events sale.events inventory.events purchase.events product.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
        for g in notification-service order-service inventory-service; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$g.dlq" --partitions 1 --replication-factor 1 --config retention.ms=2592000000
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"
    networks:
      - ecommerce-net

  # ========================================================
  # 2. Auth Microservice (Port 5008)
  # ========================================================
  auth-service:
    build:
      context: ./server
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    # Admin seed credentials (ADMIN_EMAIL / ADMIN_PASSWORD / ADMIN_NAME) come from server/.env.
    # Values under `environment:` below take precedence over this file.
    env_file:
      - ./server/.env
    environment:
      <<: *otel-env
      PORT: 5008
      AUTH_DB_URL: postgresql://postgres:postgres@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      JWT_EXPIRES_IN: 24h
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5008:5008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 3. User Microservice (Port 5001)
  # ========================================================
  user-service:
    build:
      context: ./server
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    # Admin seed credentials (ADMIN_EMAIL / ADMIN_PASSWORD / ADMIN_NAME) come from server/.env.
    # Values under `environment:` below take precedence over this file.
    env_file:
      - ./server/.env
    environment:
      <<: *otel-env
      PORT: 5001
      USER_DB_URL: postgresql://postgres:postgres@postgres:5432/user_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      JWT_EXPIRES_IN: 24h
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 4. Product & Category Microservice (Port 5002)
  # ========================================================
  product-category-service:
    build:
      context: ./server
      dockerfile: product-category-service/Dockerfile
    container_name: product-category-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      PORT: 5002
      PRODUCT_DB_URL: postgresql://postgres:postgres@postgres:5432/product_db
      REDIS_URL: redis://redis:6379
      PURCHASE_SERVICE_URL: http://purchase-service:5003
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: ecommerce-products
      MINIO_PUBLIC_URL: http://localhost:9000
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      ecommerce-net:
        aliases:
          - product-service
          - product-category-service

  # ========================================================
  # 4b. Purchase Microservice (Port 5003)
  # ========================================================
  purchase-service:
    build:
      context: ./server
      dockerfile: purchase-service/Dockerfile
    container_name: purchase-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      PORT: 5003
      PURCHASE_DB_URL: postgresql://postgres:postgres@postgres:5432/purchase_db
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 5. Order Microservice (Port 5004)
  # ========================================================
  order-service:
    build:
      context: ./server
      dockerfile: order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      PORT: 5004
      ORDER_DB_URL: postgresql://postgres:postgres@postgres:5432/order_db
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5004:5004"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 5b. Sale Microservice (Port 5005)
  # ========================================================
  sale-service:
    build:
      context: ./server
      dockerfile: sale-service/Dockerfile
    container_name: sale-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      PORT: 5005
      SALE_DB_URL: postgresql://postgres:postgres@postgres:5432/sale_db
      INVENTORY_SERVICE_URL: http://inventory-service:5006
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5005:5005"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 6. Inventory Microservice (Port 5006)
  # ========================================================
  inventory-service:
    build:
      context: ./server
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      PORT: 5006
      INVENTORY_DB_URL: postgresql://postgres:postgres@postgres:5432/inventory_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      JWT_EXPIRES_IN: 24h
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5006:5006"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 8. Notification Microservice (Port 5007)
  # ========================================================
  notification-service:
    build:
      context: ./server
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    # SMTP settings (SMTP_USER / SMTP_APP_PASSWORD …) come from server/.env — never hard-coded here
    env_file:
      - ./server/.env
    environment:
      <<: *otel-env
      PORT: 5007
      NOTIFICATION_DB_URL: postgresql://postgres:postgres@postgres:5432/notification_db
      KAFKA_BROKERS: kafka:9092
      QUEUE_REDIS_URL: redis://redis-queue:6379
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5007:5007"
    depends_on:
      redis-queue:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 8b. Policy Microservice (Port 5009)
  # ========================================================
  policy-service:
    build:
      context: ./server
      dockerfile: policy-service/Dockerfile
    container_name: policy-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      PORT: 5009
      POLICY_DB_URL: postgresql://postgres:postgres@postgres:5432/policy_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      JWT_EXPIRES_IN: 24h
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5009:5009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 9. API Gateway (Port 5000)
  # ========================================================
  api-gateway:
    build:
      context: ./server
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      <<: *otel-env
      PORT: 5000
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      JWT_EXPIRES_IN: 24h
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:5008
      USER_SERVICE_URL: http://user-service:5001
      PRODUCT_SERVICE_URL: http://product-category-service:5002
      PURCHASE_SERVICE_URL: http://purchase-service:5003
      ORDER_SERVICE_URL: http://order-service:5004
      SALE_SERVICE_URL: http://sale-service:5005
      INVENTORY_SERVICE_URL: http://inventory-service:5006
      NOTIFICATION_SERVICE_URL: http://notification-service:5007
      POLICY_SERVICE_URL: http://policy-service:5009
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: ecommerce-products
      MINIO_PUBLIC_URL: http://localhost:9000
    ports:
      - "5000:5000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      product-category-service:
        condition: service_started
      purchase-service:
        condition: service_started
      order-service:
        condition: service_started
      sale-service:
        condition: service_started
      inventory-service:
        condition: service_started
      notification-service:
        condition: service_started
      policy-service:
        condition: service_started
    networks:
      - ecommerce-net

  # ========================================================
  # 10. MinIO Object Storage Server (S3 API: 9000, Web: 9001)
  # ========================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ecommerce-net

  # ========================================================
  # 11. Monitoring: Prometheus (metrics) + Grafana (dashboards) + exporters
  #     Grafana:    http://localhost:3001  (embedded in Admin → Monitoring)
  #     Prometheus: http://localhost:9090
  # ========================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # Tempo's metrics-generator writes the service graph + span metrics here
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ecommerce-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      # Admin login for editing; override in your shell or a root .env file
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read-only anonymous viewing so the admin portal can embed the dashboard in an iframe
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nexuscommerce.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"   # host 3000 is the Vite dev server
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - ecommerce-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      # Lock waits + long-running queries (Grafana → Database Monitoring)
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./monitoring/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    restart: unless-stopped
    networks:
      - ecommerce-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ecommerce-net

  # Host CPU / RAM / disk usage / disk I/O (Grafana → System Resource Monitoring)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - ecommerce-net

  # Per-container CPU / memory / disk I/O (one series per docker-compose service)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl,process
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - ecommerce-net

  # ========================================================
  # 12. Health probes: every service's GET /health + infrastructure ports (Prometheus "probe_*")
  # ========================================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - ecommerce-net

  # ========================================================
  # 13. Logs + traces: Loki (logs) · Tempo (traces) · Alloy (collector for both)
  #     Grafana → Explore → Loki / Tempo, or the "Logs & Traces" dashboard
  # ========================================================
  loki:
    image: grafana/loki:3.5.5
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - ecommerce-net

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    restart: unless-stopped
    user: "0"   # writes to the named volume
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    depends_on:
      - prometheus
    networks:
      - ecommerce-net

  # Collects every container's stdout (docker socket) → Loki, and OTLP traces → Tempo
  alloy:
    image: grafana/alloy:v1.10.2
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "12345:12345"   # Alloy UI (pipeline debugging)
      - "4318:4318"     # OTLP/HTTP — lets services run from the host (npm run …) send traces too
    depends_on:
      - loki
      - tempo
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  kafka_data:
    driver: local
  redis_queue_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  alloy_data:
    driver: local
