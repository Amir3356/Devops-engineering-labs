services:
  # ========================================================
  # 1. PostgreSQL Database Server (Isolated DBs)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: auth_db,user_db,product_db,order_db,payment_db,inventory_db,notification_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # ========================================================
  # 2. Auth Microservice (Port 5008)
  # ========================================================
  auth-service:
    build:
      context: ./server
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      PORT: 5008
      AUTH_DB_URL: postgresql://postgres:postgres@postgres:5432/auth_db
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5008:5008"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 3. User Microservice (Port 5001)
  # ========================================================
  user-service:
    build:
      context: ./server
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      PORT: 5001
      USER_DB_URL: postgresql://postgres:postgres@postgres:5432/user_db
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 4. Product Microservice (Port 5002)
  # ========================================================
  product-service:
    build:
      context: ./server
      dockerfile: product-service/Dockerfile
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: 5002
      PRODUCT_DB_URL: postgresql://postgres:postgres@postgres:5432/product_db
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5002:5002"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 5. Order Microservice (Port 5004)
  # ========================================================
  order-service:
    build:
      context: ./server
      dockerfile: order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: 5004
      ORDER_DB_URL: postgresql://postgres:postgres@postgres:5432/order_db
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5004:5004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 6. Payment Microservice (Port 5005)
  # ========================================================
  payment-service:
    build:
      context: ./server
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    environment:
      PORT: 5005
      PAYMENT_DB_URL: postgresql://postgres:postgres@postgres:5432/payment_db
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 7. Inventory Microservice (Port 5006)
  # ========================================================
  inventory-service:
    build:
      context: ./server
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    environment:
      PORT: 5006
      INVENTORY_DB_URL: postgresql://postgres:postgres@postgres:5432/inventory_db
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5006:5006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 8. Notification Microservice (Port 5007)
  # ========================================================
  notification-service:
    build:
      context: ./server
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      PORT: 5007
      NOTIFICATION_DB_URL: postgresql://postgres:postgres@postgres:5432/notification_db
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      DB_POOL_MAX: 20
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 5000
    ports:
      - "5007:5007"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ========================================================
  # 9. API Gateway (Port 5000)
  # ========================================================
  api-gateway:
    build:
      context: ./server
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      PORT: 5000
      JWT_SECRET: ecommerce-microservices-secret-key-2026
      AUTH_SERVICE_URL: http://auth-service:5008
      USER_SERVICE_URL: http://user-service:5001
      PRODUCT_SERVICE_URL: http://product-service:5002
      ORDER_SERVICE_URL: http://order-service:5004
      PAYMENT_SERVICE_URL: http://payment-service:5005
      INVENTORY_SERVICE_URL: http://inventory-service:5006
      NOTIFICATION_SERVICE_URL: http://notification-service:5007
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
      - inventory-service
      - notification-service
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
