# ========================================================
# NexusCommerce Nginx API Gateway Configuration (engine-x)
# Central Reverse Proxy & Request Router (Ports 5000 / 80)
# ========================================================

server {
    listen 5000;
    listen 80;
    server_name localhost _;

    # Docker internal DNS resolver (enables dynamic service discovery without crashing on startup)
    resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;

    # Client payload & buffer settings
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Global Reverse Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Global CORS Handling
    set $cors_origin "*";
    set $cors_methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    set $cors_headers "Authorization, Content-Type, Accept, Origin, User-Agent, DNT, Cache-Control, X-Mx-ReqToken, Keep-Alive, X-Requested-With, If-Modified-Since, x-user-id, x-user-email, x-user-role";

    # Preflight OPTIONS handler
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Methods' $cors_methods always;
    add_header 'Access-Control-Allow-Headers' $cors_headers always;

    # ----------------------------------------------------
    # Gateway Health Check Endpoint
    # ----------------------------------------------------
    location /health {
        default_type application/json;
        return 200 '{"status":"UP","gateway":"nginx","engine":"engine-x","timestamp":"$time_iso8601"}';
    }

    # ----------------------------------------------------
    # 1. Auth Service Route (Port 5008)
    # ----------------------------------------------------
    location /api/auth {
        set $auth_upstream "http://auth-service:5008";
        proxy_pass $auth_upstream;
    }

    # ----------------------------------------------------
    # 2. User Service Route (Port 5001)
    # ----------------------------------------------------
    location /api/users {
        set $user_upstream "http://user-service:5001";
        proxy_pass $user_upstream;
    }

    # ----------------------------------------------------
    # 3. Product Service Route (Port 5002)
    # ----------------------------------------------------
    location /api/products {
        set $product_upstream "http://product-service:5002";
        proxy_pass $product_upstream;
    }

    # ----------------------------------------------------
    # 4. Order Service Route (Port 5004)
    # ----------------------------------------------------
    location /api/orders {
        set $order_upstream "http://order-service:5004";
        proxy_pass $order_upstream;
    }

    # ----------------------------------------------------
    # 5. Payment Service Route (Port 5005)
    # ----------------------------------------------------
    location /api/payments {
        set $payment_upstream "http://payment-service:5005";
        proxy_pass $payment_upstream;
    }

    # ----------------------------------------------------
    # 6. Inventory Service Route (Port 5006)
    # ----------------------------------------------------
    location /api/inventory {
        set $inventory_upstream "http://inventory-service:5006";
        proxy_pass $inventory_upstream;
    }

    # ----------------------------------------------------
    # 7. Notification Service Route (Port 5007)
    # ----------------------------------------------------
    location /api/notifications {
        set $notification_upstream "http://notification-service:5007";
        proxy_pass $notification_upstream;
    }

    # Fallback 404 handler
    location / {
        default_type application/json;
        return 404 '{"error":"Route not found on Nginx API Gateway","status":404}';
    }
}
