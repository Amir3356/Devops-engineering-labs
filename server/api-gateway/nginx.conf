# ========================================================
# NexusCommerce Nginx API Gateway Configuration (engine-x)
# Central Reverse Proxy & Request Router (Ports 5000 / 80)
# ========================================================

# Shared HTTP Response Cache Zone for public read-heavy responses
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=API_CACHE:10m max_size=250m inactive=60m use_temp_path=off;
proxy_cache_key "$scheme$request_method$host$request_uri";

server {
    listen 5000;
    listen 80;
    server_name localhost _;

    # Docker internal DNS resolver (enables dynamic service discovery without crashing on startup)
    resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;

    # Client payload & buffer settings
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Global Reverse Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Global CORS Handling
    set $cors_origin "*";
    set $cors_methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    set $cors_headers "Authorization, Content-Type, Accept, Origin, User-Agent, DNT, Cache-Control, X-Mx-ReqToken, Keep-Alive, X-Requested-With, If-Modified-Since, x-user-id, x-user-email, x-user-role";

    # Preflight OPTIONS handler
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Methods' $cors_methods always;
    add_header 'Access-Control-Allow-Headers' $cors_headers always;

    # ----------------------------------------------------
    # Gateway Health Check Endpoint
    # ----------------------------------------------------
    location /health {
        default_type application/json;
        return 200 '{"status":"UP","gateway":"nginx","engine":"engine-x","timestamp":"$time_iso8601"}';
    }

    # ----------------------------------------------------
    # 1. Auth Service Route (Port 5008)
    # ----------------------------------------------------
    location /api/auth {
        set $auth_upstream "http://auth-service:5008";
        proxy_pass $auth_upstream;
    }

    # ----------------------------------------------------
    # 2. User Service Route (Port 5001)
    # ----------------------------------------------------
    location /api/users {
        set $user_upstream "http://user-service:5001";
        proxy_pass $user_upstream;
    }

    # ----------------------------------------------------
    # 3a. Product Categories (Port 5002) - HTTP Cached
    # ----------------------------------------------------
    location = /api/products/categories {
        set $product_upstream "http://product-category-service:5002";

        # Nginx HTTP Response Caching
        proxy_cache API_CACHE;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 300s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass $product_upstream;
    }

    # ----------------------------------------------------
    # 3b. Product Catalog (Port 5002) - HTTP Cached
    # ----------------------------------------------------
    location /api/products {
        set $product_upstream "http://product-category-service:5002";

        # Nginx HTTP Response Caching
        proxy_cache API_CACHE;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass $product_upstream;
    }

    # ----------------------------------------------------
    # 4. Purchase Service Route (Port 5003)
    # ----------------------------------------------------
    location /api/purchases {
        set $purchase_upstream "http://purchase-service:5003";
        proxy_pass $purchase_upstream;
    }

    # ----------------------------------------------------
    # 5. Order Service Route (Port 5004)
    # ----------------------------------------------------
    location /api/orders {
        set $order_upstream "http://order-service:5004";
        proxy_pass $order_upstream;
    }

    # ----------------------------------------------------
    # 6. Sale Service Route (Port 5005)
    # ----------------------------------------------------
    location /api/sales {
        set $sale_upstream "http://sale-service:5005";
        proxy_pass $sale_upstream;
    }

    # ----------------------------------------------------
    # 7. Inventory Service Route (Port 5006)
    # ----------------------------------------------------
    location /api/inventory {
        set $inventory_upstream "http://inventory-service:5006";
        proxy_pass $inventory_upstream;
    }

    # ----------------------------------------------------
    # 8. Notification Service Route (Port 5007)
    # ----------------------------------------------------
    location /api/notifications {
        set $notification_upstream "http://notification-service:5007";
        proxy_pass $notification_upstream;
    }

    # ----------------------------------------------------
    # 9. Public Policy Service Route (Port 5009) - HTTP Cached
    # ----------------------------------------------------
    location /api/policies {
        set $policy_upstream "http://policy-service:5009";

        # Nginx HTTP Response Caching
        proxy_cache API_CACHE;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 300s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass $policy_upstream;
    }

    # Fallback 404 handler
    location / {
        default_type application/json;
        return 404 '{"error":"Route not found on Nginx API Gateway","status":404}';
    }
}
